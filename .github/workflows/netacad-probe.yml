name: netacad-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install playwright
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null 2>&1
      - name: probe netacad login + downloads page
        env:
          NETACAD_USER: ${{ secrets.NETACAD_USER }}
          NETACAD_PASS: ${{ secrets.NETACAD_PASS }}
        run: python3 tools/netacad_probe.py
