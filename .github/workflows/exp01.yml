name: exp01-network-commands
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq net-tools dnsutils traceroute nmap iputils-tracepath python3-pil
      - run: bash exp01/commands.sh
      - run: python3 tools/render.py exp01/out
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add exp01
          git commit -m "exp01: 20 network commands + screenshots" || true
          git push
